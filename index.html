<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="container">

    <div class="top-bar">
        <h1>🍅 Pomodoro Timer</h1>

        <button id="themeBtn">
            🌙 Dark Mode
        </button>
    </div>

    <div class="timer-card">

        <div class="mode" id="modeText">
            FOCUS MODE
        </div>

        <div class="timer" id="timer">
            25:00
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="controls">

            <button id="startBtn">
                Start
            </button>

            <button id="pauseBtn">
                Pause
            </button>

            <button id="resumeBtn">
                Resume
            </button>

            <button id="resetBtn">
                Reset
            </button>

        </div>

    </div>

    <div class="settings">

        <div>
            <label>Focus Minutes</label>

            <input
                type="number"
                id="focusInput"
                min="1"
                value="25"
            >
        </div>

        <div>
            <label>Break Minutes</label>

            <input
                type="number"
                id="breakInput"
                min="1"
                value="5"
            >
        </div>

    </div>

    <div class="stats">

        <h2>Today's Stats</h2>

        <p>
            Sessions Completed:
            <span id="sessionCount">0</span>
        </p>

        <p>
            Focus Minutes:
            <span id="focusMinutes">0</span>
        </p>

    </div>

    <div class="history">

        <h2>Today's History</h2>

        <div id="historyList">
        </div>

    </div>

</div>

<audio id="alarm">
    <source
        src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
        type="audio/ogg">
</audio>

<script src="script.js"></script>

</body>
</html>
